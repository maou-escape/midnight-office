<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Midnight Office</title>
<meta name="description" content="자정의 회사에 갇힌 1인용 방탈출 웹게임. 기록만 믿고 퇴근하기.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 타이틀 -->
<section id="title" class="screen">
  <div class="title-inner">
    <p class="title-kicker">ALL ORIGINALS VERIFIED</p>
    <h1>Midnight<br>Office</h1>
    <p class="title-sub">자정 정전부터 오전 6시 30분까지. 기록 하나를 믿지 말고, 독립된 두 기록이 같은 말을 할 때만 사실로 적을 것.</p>
    <div id="titleMenu"></div>
    <p class="title-foot">1인용 방탈출 · 자동 저장 · 전체 3~5시간 · <kbd>`</kbd> 키로 업무 시트 전환</p>
  </div>
</section>

<!-- 게임 -->
<section id="game" class="screen hidden">
  <header class="topbar">
    <button class="icon-btn" id="btnMenu" title="타이틀로">☰</button>
    <div class="where">
      <span id="partName" class="chapter-name"></span>
      <b id="roomName" class="room-name"></b>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnHint" title="힌트 (H)">?</button>
      <button class="icon-btn" id="btnNote" title="수사 수첩 (N)">✎</button>
      <button class="icon-btn" id="btnMute" title="소리 끄기/켜기 (M)">♪</button>
      <button class="icon-btn" id="btnSet" title="설정">⚙</button>
      <button class="icon-btn" id="btnBoss" title="업무 시트 (`)">▦</button>
    </div>
  </header>
  <div class="objective" id="objective"><span>현재 목표</span><b id="objectiveText"></b></div>
  <main class="stage-wrap">
    <div class="stage" id="stage">
      <div class="art" id="art"></div>
      <div class="spots" id="spots"></div>
    </div>
    <div class="room-nav" id="roomNav"></div>
    <p class="rotate-tip">휴대폰을 가로로 돌리면 방이 더 크게 보입니다.</p>
  </main>
  <footer class="inventory">
    <div class="inv-head"><span>소지품</span><small id="selectedHint"></small></div>
    <div class="inv-list" id="inventory"></div>
  </footer>
</section>

<!-- 모달 -->
<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="boss hidden" id="boss" aria-hidden="true"></div>

<script src="js/art.js"></script>
<script src="js/engine.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/chapters/e1a1.js"></script>
<script src="js/chapters/e1a2.js"></script>
<script src="js/chapters/e1a3.js"></script>
<script src="js/chapters/e1a4.js"></script>
<script src="js/chapters/e1a5.js"></script>
<script src="js/chapters/e2a1.js"></script>
<script src="js/chapters/e2a2.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
